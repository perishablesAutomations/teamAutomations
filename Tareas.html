<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de tareas — Torre de control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --panel:#121B2E;
    --panel-line:#232E47;
    --ink:#E7ECF5;
    --ink-dim:#8791A8;
    --urgente:#F2A93B;
    --urgente-dim:#4A3B1C;
    --importante:#35C4C1;
    --importante-dim:#1B3D3C;
    --baja:#6B7590;
    --baja-dim:#232C42;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  /* ---- header: tablero de salidas ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--panel-line);
    padding-bottom:20px;
    margin-bottom:28px;
  }
  .title-block h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .title-block .sub{
    color:var(--ink-dim);
    font-size:13px;
    margin-top:4px;
  }
  .clock{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;
    font-weight:700;
    letter-spacing:0.03em;
    font-variant-numeric:tabular-nums;
  }
  .clock .date{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:400;
    color:var(--ink-dim);
    text-align:right;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }

  /* ---- botón notificaciones ---- */
  .notif-bar{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:12px 16px;
    margin-bottom:28px;
    font-size:13px;
  }
  .notif-bar .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--baja);
    flex-shrink:0;
  }
  .notif-bar .dot.on{background:var(--importante); box-shadow:0 0 0 4px var(--importante-dim);}
  .notif-bar .dot.off{background:var(--urgente); box-shadow:0 0 0 4px var(--urgente-dim);}
  .notif-bar button{
    margin-left:auto;
    background:var(--ink);
    color:var(--bg);
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
  }
  .notif-bar button:hover{opacity:0.85;}
  .notif-bar button:disabled{opacity:0.4;cursor:default;}

  /* ---- columnas ---- */
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }
  @media (max-width:820px){
    .board{grid-template-columns:1fr;}
    header{align-items:flex-start;}
    .clock .date{text-align:left;}
  }
  .col{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:8px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    border-bottom:1px solid var(--panel-line);
  }
  .col-urgente .col-head{color:var(--urgente); background:var(--urgente-dim);}
  .col-importante .col-head{color:var(--importante); background:var(--importante-dim);}
  .col-baja .col-head{color:var(--baja); background:var(--baja-dim);}
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12px;
    background:rgba(255,255,255,0.08);
    padding:2px 8px;
    border-radius:10px;
  }
  .col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;}

  .task{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--panel-line);
    border-left-width:3px;
    border-radius:5px;
    padding:10px 12px;
  }
  .col-urgente .task{border-left-color:var(--urgente);}
  .col-importante .task{border-left-color:var(--importante);}
  .col-baja .task{border-left-color:var(--baja);}
  .task .t-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:14px;
    line-height:1.3;
    margin-bottom:6px;
  }
  .task .t-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    font-size:11px;
    color:var(--ink-dim);
  }
  .task .t-meta span{white-space:nowrap;}
  .empty{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    padding:24px 8px;
  }
  .status-line{
    margin-top:24px;
    color:var(--ink-dim);
    font-size:11px;
    text-align:center;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Panel de tareas</h1>
      <div class="sub">Equipo · sincronizado desde Planner</div>
    </div>
    <div class="clock">
      <span class="date" id="fecha">—</span>
      <span id="hora">--:--</span>
    </div>
  </header>

  <div class="notif-bar">
    <span class="dot off" id="notifDot"></span>
    <span id="notifText">Notificaciones desactivadas</span>
    <button id="notifBtn">Activar notificaciones</button>
  </div>

  <div class="board">
    <section class="col col-urgente">
      <div class="col-head"><span>Urgentes</span><span class="count" id="count-urgente">0</span></div>
      <div class="col-body" id="list-urgente"></div>
    </section>
    <section class="col col-importante">
      <div class="col-head"><span>Importantes</span><span class="count" id="count-importante">0</span></div>
      <div class="col-body" id="list-importante"></div>
    </section>
    <section class="col col-baja">
      <div class="col-head"><span>No tan importantes</span><span class="count" id="count-baja">0</span></div>
      <div class="col-body" id="list-baja"></div>
    </section>
  </div>

  <div class="status-line" id="statusLine">Cargando tareas…</div>

</div>

<script>
/* =========================================================
   RELOJ
========================================================= */
function tick(){
  const now = new Date();
  document.getElementById('hora').textContent = now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('fecha').textContent = now.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
}
tick(); setInterval(tick, 15000);

/* =========================================================
   DATOS DE EJEMPLO (se usan solo si tareas.json no existe aún,
   por ejemplo mientras conectas el flujo de n8n)
========================================================= */
const DATOS_EJEMPLO = {
  generated_at: new Date().toISOString(),
  urgente: [
    {id:"t1", titulo:"Confirmar reserva de bodega vuelo AV204", asignado:"Camila R.", fecha_limite:"2026-07-27T14:00:00", prioridad:"Urgent", bucket:"Despachos hoy"},
    {id:"t2", titulo:"Actualizar AWB con peso volumétrico corregido", asignado:"Sin asignar", fecha_limite:"2026-07-27T10:00:00", prioridad:"Urgent", bucket:"Documentación"}
  ],
  importante: [
    {id:"t3", titulo:"Revisar layout de zona fría para semana 31", asignado:"Julián P.", fecha_limite:"2026-07-30T17:00:00", prioridad:"Important", bucket:"Planeación"}
  ],
  no_importante: [
    {id:"t4", titulo:"Archivar guías de la semana pasada", asignado:"Camila R.", fecha_limite:"2026-08-05T17:00:00", prioridad:"Medium", bucket:"Administrativo"}
  ]
};

/* =========================================================
   CARGA DE DATOS
   El flujo de n8n publica tareas.json en el mismo repo.
   Si aún no existe (404), se muestran los datos de ejemplo.
========================================================= */
async function cargarTareas(){
  try{
    const res = await fetch('./tareas.json', {cache:'no-store'});
    if(!res.ok) throw new Error('sin tareas.json todavía');
    const data = await res.json();
    render(data);
    document.getElementById('statusLine').textContent =
      'Actualizado: ' + new Date(data.generated_at).toLocaleString('es-CO');
    return data;
  }catch(e){
    render(DATOS_EJEMPLO);
    document.getElementById('statusLine').textContent =
      'Mostrando datos de ejemplo (tareas.json aún no está publicado)';
    return DATOS_EJEMPLO;
  }
}

function fmtFecha(iso){
  if(!iso) return 'sin fecha';
  const d = new Date(iso);
  return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

function render(data){
  const cols = {urgente:'list-urgente', importante:'list-importante', no_importante:'list-baja'};
  const counts = {urgente:'count-urgente', importante:'count-importante', no_importante:'count-baja'};
  for(const key in cols){
    const tareas = data[key] || [];
    const el = document.getElementById(cols[key]);
    document.getElementById(counts[key]).textContent = tareas.length;
    el.innerHTML = tareas.length ? '' : '<div class="empty">Sin tareas aquí. Buen trabajo.</div>';
    tareas.forEach(t=>{
      const div = document.createElement('div');
      div.className = 'task';
      div.innerHTML = `
        <div class="t-title">${t.titulo}</div>
        <div class="t-meta">
          <span>👤 ${t.asignado || 'Sin asignar'}</span>
          <span>🗂 ${t.bucket || ''}</span>
          <span>⏰ ${fmtFecha(t.fecha_limite)}</span>
        </div>`;
      el.appendChild(div);
    });
  }
}

/* =========================================================
   NOTIFICACIONES (simples, solo con la pestaña abierta)
========================================================= */
const notifBtn = document.getElementById('notifBtn');
const notifDot = document.getElementById('notifDot');
const notifText = document.getElementById('notifText');

function actualizarEstadoNotif(){
  if(!('Notification' in window)){
    notifText.textContent = 'Este navegador no soporta notificaciones';
    notifBtn.disabled = true;
    return;
  }
  if(Notification.permission === 'granted'){
    notifDot.className = 'dot on';
    notifText.textContent = 'Notificaciones activas';
    notifBtn.textContent = 'Activadas';
    notifBtn.disabled = true;
  }else if(Notification.permission === 'denied'){
    notifDot.className = 'dot off';
    notifText.textContent = 'Bloqueadas en el navegador — actívalas en la configuración del sitio';
    notifBtn.disabled = true;
  }else{
    notifDot.className = 'dot off';
    notifText.textContent = 'Notificaciones desactivadas';
    notifBtn.disabled = false;
  }
}

notifBtn.addEventListener('click', async ()=>{
  const permiso = await Notification.requestPermission();
  actualizarEstadoNotif();
  if(permiso === 'granted') revisarYNotificarUrgentes(ultimosDatos);
});

/* Evita repetir la misma notificación durante el mismo día */
function yaNotificada(id){
  const hoy = new Date().toDateString();
  const registro = JSON.parse(localStorage.getItem('notif_enviadas') || '{}');
  return registro[hoy] && registro[hoy].includes(id);
}
function marcarNotificada(id){
  const hoy = new Date().toDateString();
  const registro = JSON.parse(localStorage.getItem('notif_enviadas') || '{}');
  registro[hoy] = registro[hoy] || [];
  registro[hoy].push(id);
  // limpieza simple: solo conserva el día de hoy
  localStorage.setItem('notif_enviadas', JSON.stringify({[hoy]: registro[hoy]}));
}

function revisarYNotificarUrgentes(data){
  if(!data || Notification.permission !== 'granted') return;
  const urgentes = data.urgente || [];
  urgentes.forEach((t,i)=>{
    if(yaNotificada(t.id)) return;
    setTimeout(()=>{
      new Notification('Tarea urgente: ' + t.titulo, {
        body: `${t.asignado || 'Sin asignar'} · vence ${fmtFecha(t.fecha_limite)}`,
        tag: t.id
      });
      marcarNotificada(t.id);
    }, i * 1500); // separa cada notificación para que no se agrupen
  });
}

/* =========================================================
   ARRANQUE
========================================================= */
let ultimosDatos = null;
async function init(){
  actualizarEstadoNotif();
  ultimosDatos = await cargarTareas();
  if(Notification.permission === 'granted'){
    revisarYNotificarUrgentes(ultimosDatos);
  }
  // vuelve a revisar cada 10 minutos mientras la pestaña siga abierta
  setInterval(async ()=>{
    ultimosDatos = await cargarTareas();
    revisarYNotificarUrgentes(ultimosDatos);
  }, 10 * 60 * 1000);
}
init();
</script>
</body>
</html>
